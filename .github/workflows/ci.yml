name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghosttykit:
    uses: ./.github/workflows/build-ghosttykit.yml

  build-and-test:
    needs: ghosttykit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download GhosttyKit
        uses: actions/download-artifact@v7
        with:
          name: GhosttyKit
          path: Frameworks

      - name: Verify GhosttyKit
        run: |
          ls -la Frameworks/GhosttyKit.xcframework/
          ls -la Frameworks/ghostty-resources/ | head -5

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ hashFiles('Package.resolved', '**/Package.resolved') }}
          restore-keys: spm-

      - name: Build (release)
        run: swift build -c release 2>&1

      - name: Test MoriCore
        run: cd Packages/MoriCore && swift run MoriCoreTests

      - name: Test MoriPersistence
        run: cd Packages/MoriPersistence && swift run MoriPersistenceTests

      - name: Test MoriTmux
        run: cd Packages/MoriTmux && swift run MoriTmuxTests

      - name: Test MoriIPC
        run: cd Packages/MoriIPC && swift run MoriIPCTests

  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED_DATA: .derived-data-ios
      MORI_REMUX_GHOSTTYKIT_MIRROR_URL: ${{ vars.MORI_REMUX_GHOSTTYKIT_MIRROR_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache pinned RemuxGhosttyKit
        uses: actions/cache@v5
        with:
          path: |
            Frameworks/RemuxGhosttyKit.xcframework
            Frameworks/.remux-ghosttykit-provenance
          key: remux-ghosttykit-20260731-e54ca81edf40721f72e87b5a5449746cd8fdcc877d5b0f284cdf2e34609f21f9

      - name: Fetch and verify pinned RemuxGhosttyKit
        run: |
          # PR CI may use an optional Mori mirror; otherwise its byte-pinned
          # upstream development fallback remains independently verified.
          bash scripts/fetch-remux-ghosttykit.sh
          bash scripts/verify-remux-ghosttykit.sh

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-ios-${{ hashFiles('MoriRemote/project.yml', '**/Package.resolved') }}
          restore-keys: spm-ios-

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: cd MoriRemote && xcodegen generate

      - name: Run MoriRemote Swift Testing suite
        run: |
          set -euo pipefail
          SIMULATOR="$(xcrun simctl list devices available | grep 'iPhone' | grep -oE '[A-F0-9-]{36}' | head -1)"
          xcodebuild \
            -project MoriRemote/MoriRemote.xcodeproj \
            -scheme MoriRemote \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath "$DERIVED_DATA" \
            test 2>&1 | xcbeautify

      - name: Build iPhone and iPad Release simulator products
        run: |
          set -euo pipefail
          for family in iPhone iPad; do
            SIMULATOR="$(xcrun simctl list devices available | grep "$family" | grep -oE '[A-F0-9-]{36}' | head -1)"
            xcodebuild \
              -project MoriRemote/MoriRemote.xcodeproj \
              -scheme MoriRemote \
              -configuration Release \
              -destination "platform=iOS Simulator,id=$SIMULATOR" \
              -derivedDataPath "$DERIVED_DATA" \
              build 2>&1 | xcbeautify
          done

      - name: Smoke library and deterministic Ghostty terminal
        run: MORI_IOS_SMOKE_OUTPUT="$RUNNER_TEMP/moriremote-smoke" bash scripts/smoke-moriremote-simulator.sh

      - name: Upload simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MoriRemote-simulator-smoke
          path: ${{ runner.temp }}/moriremote-smoke
          if-no-files-found: warn
          retention-days: 14

  bundle:
    needs: [ghosttykit, build-and-test]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download GhosttyKit
        uses: actions/download-artifact@v7
        with:
          name: GhosttyKit
          path: Frameworks

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ hashFiles('Package.resolved', '**/Package.resolved') }}
          restore-keys: spm-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Check signing availability
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          if [[ -n "$CERT" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Set signing identity
        if: steps.signing.outputs.available == 'true'
        env:
          DEVELOPER_NAME: ${{ secrets.APPLE_DEVELOPER_NAME }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "SIGNING_IDENTITY=Developer ID Application: ${DEVELOPER_NAME} (${TEAM_ID})" >> "$GITHUB_ENV"

      - name: Bundle Mori.app
        run: bash scripts/bundle.sh

      - name: Upload Mori.app
        uses: actions/upload-artifact@v7
        with:
          name: Mori.app
          path: Mori.app
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
