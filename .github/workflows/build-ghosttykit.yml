name: Build GhosttyKit

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Get ghostty SHA
        id: ghostty-sha
        run: |
          SHA=$(git -C vendor/ghostty rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Ghostty SHA: $SHA"

      - name: Cache GhosttyKit
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            Frameworks/GhosttyKit.xcframework
            Frameworks/ghostty-resources
            Frameworks/.ghosttykit-provenance
          key: ghosttykit-universal-v4-${{ hashFiles('ghosttykit-lock.json') }}

      - name: Install verified Zig
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source scripts/ghosttykit-contract.sh
          ghosttykit_load_contract ghosttykit-lock.json
          archive="$RUNNER_TEMP/zig.tar.xz"
          extracted="$RUNNER_TEMP/zig-aarch64-macos-${MORI_GHOSTTYKIT_ZIG_VERSION}"
          curl -fSL "https://ziglang.org/download/${MORI_GHOSTTYKIT_ZIG_VERSION}/zig-aarch64-macos-${MORI_GHOSTTYKIT_ZIG_VERSION}.tar.xz" -o "$archive"
          printf '%s  %s\n' "$MORI_GHOSTTYKIT_ZIG_ARCHIVE_SHA256" "$archive" | shasum -a 256 -c -
          tar xf "$archive" -C "$RUNNER_TEMP"
          sudo mkdir -p /usr/local/bin /usr/local/lib
          sudo cp -f "$extracted/zig" /usr/local/bin/zig
          sudo cp -rf "$extracted/lib" /usr/local/lib/zig
          [[ "$(zig version)" == "$MORI_GHOSTTYKIT_ZIG_VERSION" ]]

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
            if [ -n "$XCODE_APP" ]; then
              XCODE_DIR="$XCODE_APP/Contents/Developer"
            else
              echo "No Xcode.app found under /Applications" >&2
              exit 1
            fi
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build GhosttyKit
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ghostty.sh --universal

      - name: Verify universal GhosttyKit
        run: bash scripts/verify-ghosttykit.sh

      - name: Upload GhosttyKit artifact
        uses: actions/upload-artifact@v7
        with:
          name: GhosttyKit
          path: |
            Frameworks/GhosttyKit.xcframework
            Frameworks/ghostty-resources
            Frameworks/.ghosttykit-provenance
          include-hidden-files: true
          retention-days: 7
