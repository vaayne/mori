min_version = "2025.10.0"

[tools]
jq = "latest"
ripgrep = "latest"
fd = "latest"
xcbeautify = "latest"
tmux = "latest"
zig = "0.15.2"

[env]
PROJECT_NAME = "Mori"
DERIVED_DATA = "{{cwd}}/.derived-data"

# ─── Core ────────────────────────────────────────────────────────

[tasks.dev]
description = "Build and run Mori"
depends = ["build"]
run = '''
swift run Mori
'''

[tasks.build]
description = "Debug build"
depends = ["build:ghostty"]
run = '''
set -euo pipefail
swift build --product Mori 2>&1 | xcbeautify
'''

[tasks."build:release"]
description = "Release build"
depends = ["build:ghostty"]
run = '''
set -euo pipefail
swift build -c release --product Mori 2>&1 | xcbeautify
'''

[tasks.test]
description = "Run all tests"
depends = ["test:core", "test:persistence", "test:tmux", "test:ipc", "test:keybindings", "test:git", "test:terminal", "test:ui"]

[tasks."test:core"]
run = "cd Packages/MoriCore && swift run MoriCoreTests"

[tasks."test:git"]
run = "cd Packages/MoriGit && swift run MoriGitTests"

[tasks."test:persistence"]
run = "cd Packages/MoriPersistence && swift run MoriPersistenceTests"

[tasks."test:tmux"]
run = "cd Packages/MoriTmux && swift run MoriTmuxTests"

[tasks."test:ipc"]
run = "cd Packages/MoriIPC && swift run MoriIPCTests"

[tasks."test:keybindings"]
run = "cd Packages/MoriKeybindings && swift run MoriKeybindingsTests"

[tasks."test:terminal"]
run = "cd Packages/MoriTerminal && swift run MoriTerminalTests"

[tasks."test:ui"]
run = "cd Packages/MoriUI && swift run MoriUITests"

[tasks."build:ghostty"]
description = "Build the macOS GhosttyKit XCFramework from the pinned remux source"
run = "bash scripts/build-ghostty.sh"

[tasks."build:ghostty-universal"]
description = "Build the universal macOS + iOS GhosttyKit XCFramework from the pinned remux source"
run = "bash scripts/build-ghostty.sh --universal"

[tasks.bundle]
description = "Build release and create Mori.app bundle"
run = "bash scripts/bundle.sh"

[tasks.clean]
description = "Clean build artifacts"
run = "swift package clean && rm -rf .build .derived-data Mori.app"

# ─── Xcode ───────────────────────────────────────────────────────

[tasks."xcode:build"]
description = "Build via xcodebuild"
run = '''
set -euo pipefail
xcodebuild \
  -project "${PROJECT_NAME}.xcodeproj" \
  -scheme "$PROJECT_NAME" \
  -configuration Debug \
  -derivedDataPath "$DERIVED_DATA" \
  build 2>&1 | xcbeautify
'''

[tasks."xcode:test"]
description = "Run Xcode tests"
run = '''
set -euo pipefail
xcodebuild \
  -project "${PROJECT_NAME}.xcodeproj" \
  -scheme "$PROJECT_NAME" \
  -derivedDataPath "$DERIVED_DATA" \
  test 2>&1 | xcbeautify
'''

[tasks."xcode:generate"]
description = "Generate .xcodeproj from Package.swift"
run = "swift package generate-xcodeproj"

# ─── iOS (MoriRemote) ───────────────────────────────────────────

[tasks."test:tmux-command-builder"]
description = "Run the macOS POSIX argv contract for MoriRemote tmux commands"
run = "bash scripts/tests/test-tmux-command-builder.sh"

[tasks."test:tmux-shadow-group"]
description = "Verify local tmux grouped-shadow cleanup semantics"
run = "bash scripts/tests/test-tmux-shadow-group.sh"

[tasks."ios:generate"]
description = "Generate MoriRemote.xcodeproj from project.yml"
run = "cd MoriRemote && xcodegen generate"

[tasks."ios:verify-framework"]
description = "Verify the Mori-built universal GhosttyKit framework"
depends = ["build:ghostty-universal"]
run = "bash scripts/verify-ghosttykit.sh"

[tasks."ios:build"]
description = "Build MoriRemote for iOS Simulator"
depends = ["ios:generate", "ios:verify-framework"]
run = '''
set -euo pipefail
xcodebuild \
  -project MoriRemote/MoriRemote.xcodeproj \
  -scheme MoriRemote \
  -destination 'generic/platform=iOS Simulator' \
  -derivedDataPath "$DERIVED_DATA" \
  build 2>&1 | xcbeautify
'''

[tasks."ios:test"]
description = "Build and run MoriRemote tests on iOS Simulator"
depends = ["ios:generate", "ios:verify-framework"]
run = '''
set -euo pipefail
SIMULATOR=${MORI_IOS_SIMULATOR:-$(xcrun simctl list devices available | grep -m1 'iPhone' | sed 's/^ *//' | sed 's/ (.*//')}
xcodebuild \
  -project MoriRemote/MoriRemote.xcodeproj \
  -scheme MoriRemote \
  -destination "platform=iOS Simulator,name=$SIMULATOR" \
  -derivedDataPath "$DERIVED_DATA" \
  test 2>&1 | xcbeautify
'''

[tasks."ios:run"]
description = "Build and prove MoriRemote library + Ghostty simulator paths stay alive"
depends = ["ios:build"]
run = "bash scripts/smoke-moriremote-simulator.sh"

[tasks."ios:smoke"]
description = "Install MoriRemote and verify library/Ghostty launch, liveness, crash logs, and screenshots"
depends = ["ios:build"]
run = "bash scripts/smoke-moriremote-simulator.sh"

[tasks."test:ghosttykit-contract"]
description = "Run offline adversarial GhosttyKit lock and source-contract fixtures"
run = "bash scripts/tests/test-ghosttykit-contract.sh"

[tasks."test:ghosttykit-verify"]
description = "Prove the universal GhosttyKit verifier rejects framework tampering"
run = "bash scripts/tests/test-ghosttykit-verify.sh"

[tasks."test:release-workflows"]
description = "Verify immutable-safe GitHub release draft flows offline"
run = "bash scripts/tests/test-release-workflows.sh"

[tasks."test:moriremote-archive-verify"]
description = "Prove the MoriRemote archive verifier rejects wrong build numbers and legacy payloads"
run = "bash scripts/tests/test-verify-moriremote-archive.sh"

[tasks."ios:archive"]
description = "Archive MoriRemote for distribution"
depends = ["ios:generate", "ios:verify-framework"]
run = '''
set -euo pipefail
DERIVED_IOS="${DERIVED_DATA}-ios"
ARCHIVE_PATH="${DERIVED_IOS}/MoriRemote.xcarchive"
MARKETING_VERSION="${MARKETING_VERSION:-0.3.5}"
CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION:-1}"
xcodebuild archive \
  -project MoriRemote/MoriRemote.xcodeproj \
  -scheme MoriRemote \
  -destination 'generic/platform=iOS' \
  -archivePath "$ARCHIVE_PATH" \
  -derivedDataPath "$DERIVED_IOS" \
  MARKETING_VERSION="$MARKETING_VERSION" \
  CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
  2>&1 | xcbeautify
echo "✅ Archive created at $ARCHIVE_PATH"
'''

[tasks."ios:export"]
description = "Export IPA from archive"
depends = ["ios:archive"]
run = '''
set -euo pipefail
DERIVED_IOS="${DERIVED_DATA}-ios"
ARCHIVE_PATH="${DERIVED_IOS}/MoriRemote.xcarchive"
EXPORT_DIR="${DERIVED_IOS}/export"
EXPORT_PLIST="${EXPORT_OPTIONS_PLIST:-MoriRemote/ExportOptions.plist}"
if [ ! -f "$EXPORT_PLIST" ]; then
  echo "❌ Export options plist not found: $EXPORT_PLIST"
  exit 1
fi
xcodebuild -exportArchive \
  -archivePath "$ARCHIVE_PATH" \
  -exportOptionsPlist "$EXPORT_PLIST" \
  -exportPath "$EXPORT_DIR" \
  2>&1 | xcbeautify
echo "✅ IPA exported to $EXPORT_DIR"
'''

[tasks."ios:upload"]
description = "Upload IPA to App Store Connect / TestFlight"
run = '''
set -euo pipefail
DERIVED_IOS="${DERIVED_DATA}-ios"
EXPORT_DIR="${DERIVED_IOS}/export"
IPA_PATH=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)
if [ -z "$IPA_PATH" ]; then
  echo "❌ No IPA found in $EXPORT_DIR. Run ios:export first."
  exit 1
fi
xcrun altool --upload-app \
  --type ios \
  --file "$IPA_PATH" \
  --username "${APPLE_ID}" \
  --password "${APPLE_APP_PASSWORD}"
echo "✅ Uploaded $IPA_PATH to App Store Connect"
'''
