name: MoriRemote
options:
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  MoriCore:
    path: ../Packages/MoriCore
  MoriTmux:
    path: ../Packages/MoriTmux
  MoriSSH:
    path: ../Packages/MoriSSH
  MoriTerminal:
    path: ../Packages/MoriTerminal
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.13.0"
targets:
  MoriRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoriRemote
    dependencies:
      - package: MoriCore
        product: MoriCore
      - package: MoriTmux
        product: MoriTmux
      - package: MoriSSH
        product: MoriSSH
      - package: MoriTerminal
        product: MoriTerminal
      - package: SwiftTerm
        product: SwiftTerm
      # Static iOS framework: link only; do not embed/sign it into the app bundle.
      - framework: ../Frameworks/RemuxGhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: MoriRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.vaayne.mori-remote
        # Force-load one inert ABI symbol: validate linkage without changing runtime flow.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
          - -Wl,-u,_ghostty_tmux_client_config_new
        INFOPLIST_FILE: MoriRemote/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        MARKETING_VERSION: ${MARKETING_VERSION:0.1.0}
        CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION:1}
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "MoriRemote App Store"
  MoriRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoriRemoteTests
    dependencies:
      - target: MoriRemote
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoriRemote:
    build:
      targets:
        MoriRemote: all
    archive:
      config: Release
    test:
      targets:
        - MoriRemoteTests
