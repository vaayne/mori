name: MoriRemote
options:
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  Citadel:
    url: https://github.com/h3nock/Citadel.git
    revision: 1d0eadd81d0a521b00ede6663c8b3301f5fc252e
  NIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.97.1
  NIOSSH:
    url: https://github.com/h3nock/swift-nio-ssh.git
    revision: 7588777b8f6439efa1a33117f86cb2729abd864c
targets:
  MoriRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoriRemote
    dependencies:
      - package: Citadel
        product: Citadel
      - package: NIO
        product: NIO
      - package: NIO
        product: NIOPosix
      - package: NIOSSH
        product: NIOSSH
      # Static iOS framework: link only; do not embed/sign it into the app bundle.
      - framework: ../Frameworks/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: MoriRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.vaayne.mori-remote
        # Force-load one inert ABI symbol: validate linkage without changing runtime flow.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
          - -Wl,-u,_ghostty_tmux_client_config_new
        INFOPLIST_FILE: MoriRemote/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        GENERATE_INFOPLIST_FILE: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        # TestFlight overrides only the build number; the marketing version is
        # deliberately pinned to 0.3.5 unless a product decision changes it.
        MARKETING_VERSION: "0.3.5"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "MoriRemote App Store"
    postBuildScripts:
      - name: Embed MoriRemote third-party notices
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ditto "$SRCROOT/../THIRD_PARTY_NOTICES.md" "$destination/THIRD_PARTY_NOTICES.md"
          rm -rf "$destination/THIRD_PARTY_LICENSES"
          ditto "$SRCROOT/../THIRD_PARTY_LICENSES" "$destination/THIRD_PARTY_LICENSES"
  MoriRemoteTerminal:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoriRemoteTerminal
    dependencies:
      # The transplant target deliberately links no upstream app package. Its
      # only binary dependency is Mori's pinned universal GhosttyKit artifact.
      - framework: ../Frameworks/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: MoriRemoteTerminal
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
        # Phase 2 links this archive into MoriRemote. Keep it static now: the
        # app will then be the single bundle consumer of GhosttyKit, with no
        # second embedded terminal dylib.
        MACH_O_TYPE: staticlib
  MoriRemoteTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoriRemoteTerminalTests
    dependencies:
      - target: MoriRemoteTerminal
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # Static terminal archive exposes GhosttyKit C++ symbols to XCTest.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
  MoriRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoriRemoteTests
    dependencies:
      - target: MoriRemote
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoriRemote:
    build:
      targets:
        MoriRemote: all
    archive:
      config: Release
    test:
      targets:
        - MoriRemoteTests
        - MoriRemoteTerminalTests
